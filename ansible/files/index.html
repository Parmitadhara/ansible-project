<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Space Shooter</title>
  <style>
    /* RESET & CORE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #050505;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* GAME CONTAINER FRAME */
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 4px solid #00ffcc;
      box-shadow: 0 0 20px #00ffcc, inset 0 0 15px rgba(0, 255, 204, 0.5);
      background-color: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD overlay (Score, Health, Level) */
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffcc;
      pointer-events: none;
    }

    /* OVERLAY SCREENS (Start / Game Over) */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .overlay h1 {
      font-size: 48px;
      color: #ff0055;
      text-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055;
      letter-spacing: 4px;
      text-align: center;
    }

    .overlay p {
      font-size: 18px;
      color: #cccccc;
      text-align: center;
      line-height: 1.6;
    }

    .btn {
      padding: 12px 30px;
      font-size: 20px;
      font-family: inherit;
      font-weight: bold;
      color: #000;
      background-color: #00ffcc;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 15px #00ffcc;
      transition: all 0.2s ease-in-out;
    }

    .btn:hover {
      background-color: #ffffff;
      box-shadow: 0 0 25px #ffffff;
      transform: scale(1.05);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- HUD -->
    <div id="hud">
      <div>SCORE: <span id="score-val">0</span></div>
      <div>HEALTH: <span id="health-val">100</span>%</div>
    </div>

    <!-- CANVAS -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- START SCREEN -->
    <div id="start-screen" class="overlay">
      <h1>GALACTIC DEFENDER</h1>
      <p>Use <b>A/D</b> or <b>Left/Right Arrows</b> to Move<br>Press <b>SPACEBAR</b> to Fire</p>
      <button class="btn" id="start-btn">START GAME</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameover-screen" class="overlay hidden">
      <h1>GAME OVER</h1>
      <p>Final Score: <span id="final-score">0</span></p>
      <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    // ==========================================
    // AUDIO SYNTHESIZER (Web Audio API)
    // ==========================================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    // Play procedural arcade sound effects
    function playSound(type) {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'laser') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'explosion') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      }
    }

    // ==========================================
    // GAME ENGINE & SETUP
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score-val');
    const healthEl = document.getElementById('health-val');
    const finalScoreEl = document.getElementById('final-score');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let score = 0;
    let gameActive = false;
    let animationFrameId = null;
    let lastEnemySpawn = 0;
    const enemySpawnInterval = 1000; // ms

    // KEYBOARD INPUT TRACKING
    const keys = {
      ArrowLeft: false,
      ArrowRight: false,
      KeyA: false,
      KeyD: false,
      Space: false
    };

    window.addEventListener('keydown', (e) => {
      if (e.code in keys) {
        keys[e.code] = true;
        // Prevent space bar from scrolling down the page
        if (e.code === 'Space') e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code in keys) {
        keys[e.code] = false;
      }
    });

    // ==========================================
    // GAME OBJECT CLASSES
    // ==========================================

    // PLAYER SHIP
    class Player {
      constructor() {
        this.width = 40;
        this.height = 40;
        this.x = canvas.width / 2 - this.width / 2;
        this.y = canvas.height - 70;
        this.speed = 7;
        this.health = 100;
        this.lastShotTime = 0;
        this.shootCooldown = 180; // ms between shots
      }

      draw() {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

        // Ship Body (Neon Triangle)
        ctx.beginPath();
        ctx.moveTo(0, -this.height / 2);
        ctx.lineTo(this.width / 2, this.height / 2);
        ctx.lineTo(0, this.height / 3);
        ctx.lineTo(-this.width / 2, this.height / 2);
        ctx.closePath();

        ctx.fillStyle = '#00ffcc';
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 15;
        ctx.fill();

        // Thruster Engine Flame
        if (gameActive) {
          ctx.beginPath();
          ctx.moveTo(-10, this.height / 2);
          ctx.lineTo(0, this.height / 2 + 10 + Math.random() * 8);
          ctx.lineTo(10, this.height / 2);
          ctx.fillStyle = '#ff0055';
          ctx.fill();
        }

        ctx.restore();
      }

      update() {
        // Horizontal Movement
        if ((keys.ArrowLeft || keys.KeyA) && this.x > 0) {
          this.x -= this.speed;
        }
        if ((keys.ArrowRight || keys.KeyD) && this.x < canvas.width - this.width) {
          this.x += this.speed;
        }

        // Shooting Mechanism
        if (keys.Space) {
          const now = Date.now();
          if (now - this.lastShotTime > this.shootCooldown) {
            bullets.push(new Bullet(this.x + this.width / 2, this.y));
            playSound('laser');
            this.lastShotTime = now;
          }
        }
      }
    }

    // PROJECTILES
    class Bullet {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 4;
        this.speed = 10;
        this.markedForDeletion = false;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffff00';
        ctx.shadowColor = '#ffff00';
        ctx.shadowBlur = 10;
        ctx.fill();
      }

      update() {
        this.y -= this.speed;
        if (this.y < 0) {
          this.markedForDeletion = true;
        }
      }
    }

    // ENEMIES
    class Enemy {
      constructor() {
        this.width = 35;
        this.height = 35;
        this.x = Math.random() * (canvas.width - this.width);
        this.y = -this.height;
        this.speed = 2 + Math.random() * 3;
        this.markedForDeletion = false;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

        // Enemy Shape (Invaded diamond shape)
        ctx.beginPath();
        ctx.moveTo(0, this.height / 2);
        ctx.lineTo(this.width / 2, -this.height / 2);
        ctx.lineTo(0, -this.height / 4);
        ctx.lineTo(-this.width / 2, -this.height / 2);
        ctx.closePath();

        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 12;
        ctx.fill();

        ctx.restore();
      }

      update() {
        this.y += this.speed;

        // Reached bottom of screen without being destroyed
        if (this.y > canvas.height) {
          this.markedForDeletion = true;
          player.health -= 10;
          playSound('hit');
          updateHUD();
          if (player.health <= 0) {
            endGame();
          }
        }
      }
    }

    // PARTICLE EFFECTS (Explosions)
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = Math.random() * 3 + 1;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.alpha = 1;
        this.markedForDeletion = false;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.03;
        if (this.alpha <= 0) {
          this.markedForDeletion = true;
        }
      }
    }

    // STARFIELD BACKGROUND
    class Star {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 1.5;
        this.speed = Math.random() * 0.8 + 0.2;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fill();
      }

      update() {
        this.y += this.speed;
        if (this.y > canvas.height) {
          this.y = 0;
          this.x = Math.random() * canvas.width;
        }
      }
    }

    // ==========================================
    // GAME INSTANTIATION & UTILITIES
    // ==========================================
    let player = new Player();
    let bullets = [];
    let enemies = [];
    let particles = [];
    const stars = Array.from({ length: 80 }, () => new Star());

    function createExplosion(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function updateHUD() {
      scoreEl.innerText = score;
      healthEl.innerText = Math.max(0, player.health);
    }

    // AABB Collision Detection
    function isColliding(rect1, rect2) {
      return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
      );
    }

    // Point vs Rectangle Collision Detection
    function pointInRect(px, py, rect) {
      return (
        px >= rect.x &&
        px <= rect.x + rect.width &&
        py >= rect.y &&
        py <= rect.y + rect.height
      );
    }

    // ==========================================
    // MAIN GAME LOOP
    // ==========================================
    function gameLoop(timestamp) {
      if (!gameActive) return;

      // Clear Canvas
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; // Trail effect
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Render Starfield Background
      stars.forEach((star) => {
        star.update();
        star.draw();
      });

      // Update & Draw Player
      player.update();
      player.draw();

      // Spawn Enemies periodically
      if (timestamp - lastEnemySpawn > enemySpawnInterval) {
        enemies.push(new Enemy());
        lastEnemySpawn = timestamp;
      }

      // Update & Draw Bullets
      bullets.forEach((bullet) => bullet.update());
      bullets.forEach((bullet) => bullet.draw());

      // Update & Draw Enemies
      enemies.forEach((enemy) => enemy.update());
      enemies.forEach((enemy) => enemy.draw());

      // Update & Draw Particles
      particles.forEach((particle) => particle.update());
      particles.forEach((particle) => particle.draw());

      // --- COLLISION DETECTION ---

      // 1. Bullet vs Enemy
      bullets.forEach((bullet) => {
        enemies.forEach((enemy) => {
          if (!bullet.markedForDeletion && !enemy.markedForDeletion) {
            if (pointInRect(bullet.x, bullet.y, enemy)) {
              bullet.markedForDeletion = true;
              enemy.markedForDeletion = true;
              createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff0055');
              playSound('explosion');
              score += 100;
              updateHUD();
            }
          }
        });
      });

      // 2. Enemy vs Player
      enemies.forEach((enemy) => {
        if (!enemy.markedForDeletion) {
          if (isColliding(player, enemy)) {
            enemy.markedForDeletion = true;
            createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff0055');
            playSound('hit');
            player.health -= 20;
            updateHUD();

            if (player.health <= 0) {
              endGame();
            }
          }
        }
      });

      // CLEANUP MARKED OBJECTS
      bullets = bullets.filter((b) => !b.markedForDeletion);
      enemies = enemies.filter((e) => !e.markedForDeletion);
      particles = particles.filter((p) => !p.markedForDeletion);

      // Continue Loop
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // ==========================================
    // GAME CONTROL FUNCTIONS
    // ==========================================
    function startGame() {
      initAudio();

      // Reset Variables
      score = 0;
      player = new Player();
      bullets = [];
      enemies = [];
      particles = [];
      updateHUD();

      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');

      gameActive = true;
      lastEnemySpawn = performance.now();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
      gameActive = false;
      cancelAnimationFrame(animationFrameId);
      playSound('explosion');
      finalScoreEl.innerText = score;
      gameoverScreen.classList.remove('hidden');
    }

    // EVENT LISTENERS
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
